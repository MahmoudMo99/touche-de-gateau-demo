<header class="navbar">
  <div class="container navbar__container">
    <a routerLink="/" class="navbar__brand" aria-label="العودة إلى الصفحة الرئيسية">
      <span class="navbar__brand-icon">
        <svg lucideCakeSlice aria-hidden="true"></svg>
      </span>

      <span class="navbar__brand-text">
        <span class="navbar__brand-main">TOUCHÉ</span>
        <span class="navbar__brand-sub">DE GATEAU</span>
      </span>
    </a>

    <nav class="navbar__links" aria-label="روابط الموقع الرئيسية">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        الرئيسية
      </a>

      <a routerLink="/products" routerLinkActive="active">المنتجات</a>

      <a routerLink="/" fragment="about">من نحن</a>

      <a routerLink="/" fragment="contact">تواصل معنا</a>
    </nav>

    <div class="navbar__actions">
      <div class="navbar__search-wrapper">
        @if (searchOpened()) {
          <div class="navbar__search">
            <input
              type="search"
              placeholder="ابحث عن منتج..."
              aria-label="البحث عن منتج"
              [value]="searchValue()"
              (input)="onSearchInput($event)"
              (keyup.enter)="search()"
            />

            <button type="button" aria-label="تنفيذ البحث" (click)="search()">
              <svg lucideSearch aria-hidden="true"></svg>
            </button>
          </div>
        }

        <button
          class="navbar__icon-button"
          type="button"
          [attr.aria-label]="searchOpened() ? 'إغلاق البحث' : 'فتح البحث'"
          [attr.aria-expanded]="searchOpened()"
          (click)="toggleSearch()"
        >
          @if (searchOpened()) {
            <svg lucideX aria-hidden="true"></svg>
          } @else {
            <svg lucideSearch aria-hidden="true"></svg>
          }
        </button>
      </div>

      <a routerLink="/cart" class="navbar__icon-button navbar__cart" aria-label="السلة">
        <svg lucideShoppingCart aria-hidden="true"></svg>

        @if (cartService.totalItems() > 0) {
          <span class="navbar__cart-count">
            {{ cartService.totalItems() }}
          </span>
        }
      </a>

      <button
        class="navbar__icon-button navbar__menu-button"
        type="button"
        [attr.aria-label]="menuOpened() ? 'إغلاق القائمة' : 'فتح القائمة'"
        [attr.aria-expanded]="menuOpened()"
        (click)="toggleMenu()"
      >
        @if (menuOpened()) {
          <svg lucideX aria-hidden="true"></svg>
        } @else {
          <svg lucideMenu aria-hidden="true"></svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpened()) {
    <div class="navbar__mobile-panel">
      <div class="container navbar__mobile-container">
        <a routerLink="/" (click)="closeMenu()">
          <svg lucideHome aria-hidden="true"></svg>
          <span>الرئيسية</span>
        </a>

        <a routerLink="/products" (click)="closeMenu()">
          <svg lucidePackage aria-hidden="true"></svg>
          <span>المنتجات</span>
        </a>

        <a routerLink="/" fragment="about" (click)="closeMenu()">
          <svg lucideInfo aria-hidden="true"></svg>
          <span>من نحن</span>
        </a>

        <a routerLink="/" fragment="contact" (click)="closeMenu()">
          <svg lucidePhone aria-hidden="true"></svg>
          <span>تواصل معنا</span>
        </a>
      </div>
    </div>
  }
</header>
